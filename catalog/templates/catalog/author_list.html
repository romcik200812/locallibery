{% extends "base_generic.html" %}

{% block content %}
  <h1>Список авторов</h1>

  {% if author_list %}
    <ul>
      {% for author in author_list %}
        <li>
          <a href="{{ author.get_absolute_url }}">
            {{ author }} ({{ author.date_of_birth|date:"Y" }})
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Нет авторов.</p>
  {% endif %}
{% endblock %}
