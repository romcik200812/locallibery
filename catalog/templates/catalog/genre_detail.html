{% extends "base_generic.html" %}
{% block content %}
  <h1>Genre: {{ genre.name }}</h1>
  <h4>Books</h4>
  {% for book in genre.book_set.all %}
    <p><a href="{{ book.get_absolute_url }}">{{ book.title }}</a></p>
  {% empty %}
    <p>There are no books in this genre.</p>
  {% endfor %}
{% endblock %}
