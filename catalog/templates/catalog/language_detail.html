{% extends "base_generic.html" %}
{% block content %}
  <h1>Language: {{ language.name }}</h1>
  <h4>Books</h4>
  {% for book in language.book_set.all %}
    <p><a href="{{ book.get_absolute_url }}">{{ book.title }}</a></p>
  {% empty %}
    <p>There are no books in this language.</p>
  {% endfor %}
{% endblock %}
